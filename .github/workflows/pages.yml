name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload protected pages to Supabase Storage (optional)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROTECTED_PAGES_BUCKET: protected-pages
          PROTECTED_PAGES_DIR: private_pages
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "Skipping protected pages upload (missing SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY)."
            exit 0
          fi

          if [[ ! -d "${PROTECTED_PAGES_DIR}" ]]; then
            echo "Skipping protected pages upload (missing ${PROTECTED_PAGES_DIR}/ directory)."
            exit 0
          fi

          node scripts/upload-protected-pages.mjs

      - name: Generate runtime auth config (from Actions secrets)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "Missing SUPABASE_URL and/or SUPABASE_ANON_KEY. Add them in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p content

          # This file is public in the deployed site (GitHub Pages is static hosting).
          # It is used to avoid committing credentials to the repo history.
          node - <<'NODE'
          const fs = require('fs');

          const supabaseUrl = process.env.SUPABASE_URL || '';
          const supabaseAnonKey = process.env.SUPABASE_ANON_KEY || '';
          const authConfigPath = 'content/auth.config.json';

          function getProjectRefFromUrl(url) {
            const match = String(url).trim().match(/^https:\/\/([^.]+)\.supabase\.co\/?$/i);
            return match ? match[1] : '';
          }

          function decodeBase64Url(segment) {
            const normalized = String(segment).replace(/-/g, '+').replace(/_/g, '/');
            return Buffer.from(normalized.padEnd(Math.ceil(normalized.length / 4) * 4, '='), 'base64').toString('utf8');
          }

          function getProjectRefFromJwt(jwt) {
            try {
              const [, payload = ''] = String(jwt).split('.');
              const parsed = JSON.parse(decodeBase64Url(payload));
              return typeof parsed.ref === 'string' ? parsed.ref : '';
            } catch {
              return '';
            }
          }

          let expectedSupabaseUrl = '';
          try {
            const authConfig = JSON.parse(fs.readFileSync(authConfigPath, 'utf8'));
            expectedSupabaseUrl = authConfig?.supabase?.url || '';
          } catch (error) {
            throw new Error(`Unable to read ${authConfigPath}: ${error.message}`);
          }

          if (expectedSupabaseUrl && supabaseUrl !== expectedSupabaseUrl) {
            throw new Error(`SUPABASE_URL secret mismatch. Expected ${expectedSupabaseUrl} but received ${supabaseUrl}.`);
          }

          const urlRef = getProjectRefFromUrl(supabaseUrl || expectedSupabaseUrl);
          const anonRef = getProjectRefFromJwt(supabaseAnonKey);
          if (urlRef && anonRef && urlRef !== anonRef) {
            throw new Error(`SUPABASE_ANON_KEY targets project "${anonRef}" but SUPABASE_URL targets "${urlRef}".`);
          }

          const payload = {
            version: 1,
            supabase: {
              url: expectedSupabaseUrl || supabaseUrl,
              anonKey: supabaseAnonKey
            }
          };

          fs.writeFileSync('content/auth.runtime.json', JSON.stringify(payload, null, 2) + '\n', 'utf8');
          console.log('Wrote content/auth.runtime.json');
          NODE

      - name: Build Pages artifact (dist)
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          # Copy only what the static site needs.
          cp index.html dist/
          cp -R assets content css js dist/

          # The operational graph runtime fetches this fictional dataset at page load.
          # Copy only the runtime JSON instead of publishing the whole docs folder.
          mkdir -p dist/docs/relationship-graph-refactor
          cp docs/relationship-graph-refactor/operational-context-graph.dataset.json dist/docs/relationship-graph-refactor/

          # Convenience: keep README out of the deploy artifact.
          # Protected content sources (if present) must never be deployed.
          rm -rf dist/private_pages || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-supabase-functions:
    runs-on: ubuntu-latest
    needs: build
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase Edge Functions
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "Missing SUPABASE_ACCESS_TOKEN. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "Missing SUPABASE_URL. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          project_ref="$(node - <<'NODE'
          const url = process.env.SUPABASE_URL || '';
          const match = url.trim().match(/^https:\/\/([^.]+)\.supabase\.co\/?$/i);
          if (!match) {
            throw new Error(`Unable to derive Supabase project ref from SUPABASE_URL: ${url}`);
          }
          process.stdout.write(match[1]);
          NODE
          )"

          supabase functions deploy --project-ref "${project_ref}"
